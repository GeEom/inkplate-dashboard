[package]
name = "inkplate-dashboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND LGPL-3.0-only"
publish = false

# No test harness exists for the Xtensa no_std target: the protocol and
# decoder code is tested on the host (host/, scripts/host_tls_test.sh).
[[bin]]
name = "inkplate-dashboard"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "1.1.1", features = ["esp32", "unstable", "rt"] }
esp-backtrace = { version = "0.19", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.17", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32"] }
# The radio's scheduler comes from esp-rtos, started in main.
esp-radio = { version = "1.0.0-beta.0", features = ["esp32", "wifi", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "esp-radio", "esp-alloc"] }
esp-alloc = "0.10"
smoltcp = { version = "0.13", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-tcp",
    "socket-dns",
] }
# TLS 1.3 client, pure Rust, no_std. Its webpki verifier checks chains with
# rustls-webpki, P-256 and P-384 (public CAs such as GTS and ISRG sign with
# P-384 above the leaf). src/http.rs drives it without a clock: see the README.
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", default-features = false, features = ["webpki", "p256", "p384"] }
# embedded-tls's crypto, linked in as software drivers; the RNG driver is the
# TRNG, registered in src/main.rs.
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-sha384",
    "embassy-crypto-hmac-sha256",
    "embassy-crypto-aes128-gcm",
    "embassy-crypto-p256-ecdh",
    "embassy-crypto-p256-ecdsa",
    "embassy-crypto-p384-ecdsa",
] }
embedded-io = { version = "0.7", default-features = false }
# Used directly when the chain memo skips path-building and src/http.rs checks
# CertificateVerify through rustls-webpki; versions track embedded-tls's own
# pins so types unify. ecdsa is here for its DER signatures.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false }
pki-types = { package = "rustls-pki-types", version = "1.14", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.17", default-features = false, features = ["der"] }
# Inflate for PNG frames (src/png.rs): no_std, no alloc; decompresses the
# IDAT chunks straight into a caller-provided buffer.
miniz_oxide = { version = "0.8", default-features = false }
# Hands out each DMA, socket and TLS buffer once, without `static mut`.
static_cell = "2.1"

# The radio needs opt-level 2/3 and broke under fat LTO + opt-level "s"
# (garbage pointers inside the wifi blob), as in esp-hal's wifi examples.
[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[lints]
workspace = true

[workspace]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
# groups — priority -1, or clippy's lint_groups_priority fails an allow below
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible     = { level = "deny", priority = -1 }
nonstandard_style       = { level = "deny", priority = -1 }
rust_2018_idioms        = { level = "deny", priority = -1 }
unused                  = { level = "deny", priority = -1 }
missing_docs            = "deny"
unsafe_code             = "deny"
unsafe_op_in_unsafe_fn  = "deny"

[workspace.lints.clippy]
# groups — priority -1 so specific lines can override
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
nursery     = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# individual denies
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
used_underscore_binding         = "deny"
if_then_some_else_none          = "deny"
missing_const_for_fn            = "deny"
missing_errors_doc              = "deny"
missing_panics_doc              = "deny"
indexing_slicing                = "deny"
result_large_err                = "deny"
shadow_unrelated                = "deny"
wildcard_imports                = "deny"
map_err_ignore                  = "deny"
enum_glob_use                   = "deny"
infinite_loop                   = "deny"
unimplemented                   = "deny"
expect_used                     = "deny"
unwrap_used                     = "deny"
empty_loop                      = "deny"
mem_forget                      = "deny"
dbg_macro                       = "deny"
panic                           = "deny"
todo                            = "deny"
exit                            = "deny"
unreachable                     = "deny"
let_underscore_must_use         = "deny"
let_underscore_untyped          = "deny"
print_stdout                    = "deny"
print_stderr                    = "deny"
unused_result_ok                = "deny"
undocumented_unsafe_blocks      = "deny"
multiple_unsafe_ops_per_block   = "deny"
iter_over_hash_type             = "deny"
# the only permitted allows
module_name_repetitions = "allow"
similar_names           = "allow"
redundant_pub_crate     = "allow"
multiple_crate_versions = "allow"
