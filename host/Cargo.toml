# Host-side harness: compiles the firmware's src/http.rs, src/png.rs and
# src/roots.rs (via #[path]) and runs them against real TLS 1.3 servers and
# PNG fixtures. Run via scripts/host_tls_test.sh.
[package]
name = "inkplate-dashboard-host-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
# Feature set must mirror the firmware Cargo.toml, as the code is shared.
embedded-tls = { version = "=0.19.0", default-features = false, features = ["rustpki", "p384"] }
embedded-io = "0.7"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384"] }
der = { version = "0.8", default-features = false }
# Inflate for PNG frames (src/png.rs): no_std, no alloc; decompresses the
# IDAT chunks straight into a caller-provided buffer.
miniz_oxide = { version = "0.8", default-features = false }
# OsRng for the TLS handshake (the device uses its hardware TRNG here).
rand_core = { version = "0.6", features = ["getrandom"] }
# The test server's body pattern and the root store's pinned hashes.
sha2 = "0.10"

# Standalone: never absorbed into a parent workspace by accident.
[workspace]

[workspace.lints.rust]
# groups — priority -1, or clippy's lint_groups_priority fails an allow below
rust_2024_compatibility = { level = "deny", priority = -1 }
future_incompatible     = { level = "deny", priority = -1 }
nonstandard_style       = { level = "deny", priority = -1 }
rust_2018_idioms        = { level = "deny", priority = -1 }
unused                  = { level = "deny", priority = -1 }
missing_docs            = "deny"
unsafe_code             = "deny"
unsafe_op_in_unsafe_fn  = "deny"

[workspace.lints.clippy]
# groups — priority -1 so specific lines can override
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
nursery     = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# individual denies
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
used_underscore_binding         = "deny"
if_then_some_else_none          = "deny"
missing_const_for_fn            = "deny"
missing_errors_doc              = "deny"
missing_panics_doc              = "deny"
indexing_slicing                = "deny"
result_large_err                = "deny"
shadow_unrelated                = "deny"
wildcard_imports                = "deny"
map_err_ignore                  = "deny"
enum_glob_use                   = "deny"
infinite_loop                   = "deny"
unimplemented                   = "deny"
expect_used                     = "deny"
unwrap_used                     = "deny"
empty_loop                      = "deny"
mem_forget                      = "deny"
dbg_macro                       = "deny"
panic                           = "deny"
todo                            = "deny"
exit                            = "deny"
unreachable                     = "deny"
let_underscore_must_use         = "deny"
let_underscore_untyped          = "deny"
print_stdout                    = "deny"
print_stderr                    = "deny"
unused_result_ok                = "deny"
undocumented_unsafe_blocks      = "deny"
multiple_unsafe_ops_per_block   = "deny"
# the only permitted allows
module_name_repetitions = "allow"
similar_names           = "allow"
redundant_pub_crate     = "allow"
multiple_crate_versions = "allow"

[lints]
workspace = true
